          "app/src/main/java/com/kai/rucoymacro/Vision.kt": r'''// app/src/main/java/com/kai/rucoymacro/Vision.kt
          package com.kai.rucoymacro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Rect
          import java.io.File
          import java.io.FileNotFoundException
          import org.opencv.android.OpenCVLoader
          import org.opencv.android.Utils
          import org.opencv.core.Core
          import org.opencv.core.Mat
          import org.opencv.core.MatOfByte
          import org.opencv.core.Rect as CvRect
          import org.opencv.imgcodecs.Imgcodecs
          import org.opencv.imgproc.Imgproc

          object Vision {
              @Volatile
              var ok = false
                  private set

              fun init(): Boolean {
                  // initLocal carrega as .so empacotadas no AAR oficial; sem OpenCV Manager.
                  if (!ok) ok = OpenCVLoader.initLocal()
                  return ok
              }

              private data class Cache(val mat: Mat?, val lastModified: Long)

              private val cache = HashMap<String, Cache>()

              @Synchronized
              fun template(context: Context, nome: String, opcional: Boolean): Mat? {
                  val arquivo = File(Config.DIR_TEMPLATES, nome)
                  val lm = if (arquivo.isFile) arquivo.lastModified() else -1L
                  val atual = cache[nome]
                  if (atual != null && atual.lastModified == lm) return atual.mat

                  var novo: Mat? = null
                  if (lm >= 0) {
                      val m = Imgcodecs.imread(arquivo.absolutePath, Imgcodecs.IMREAD_COLOR)
                      if (!m.empty()) novo = m else m.release()
                  }
                  if (novo == null) {
                      val bytes = try {
                          context.assets.open(nome).use { it.readBytes() }
                      } catch (e: FileNotFoundException) {
                          null
                      }
                      if (bytes != null) {
                          val buf = MatOfByte(*bytes.toTypedArray())
                          val m = Imgcodecs.imdecode(buf, Imgcodecs.IMREAD_COLOR)
                          buf.release()
                          if (!m.empty()) novo = m else m.release()
                      }
                  }
                  if (novo == null && !opcional) return null
                  atual?.mat?.release()
                  cache[nome] = Cache(novo, lm)
                  return novo
              }

              fun encontrar(bitmap: Bitmap, template: Mat, threshold: Double, regiao: Rect): Rect? {
                  if (template.empty()) return null
                  val roi = CvRect(regiao.left, regiao.top, regiao.width(), regiao.height())
                  if (template.cols() > roi.width || template.rows() > roi.height) return null
                  val rgba = Mat()
                  val bgr = Mat()
                  var recorte: Mat? = null
                  var resultado: Mat? = null
                  try {
                      Utils.bitmapToMat(bitmap, rgba)
                      // Template é BGR (imread/imdecode); casa o espaço de canais antes do match.
                      Imgproc.cvtColor(rgba, bgr, Imgproc.COLOR_RGBA2BGR)
                      recorte = Mat(bgr, roi)
                      resultado = Mat()
                      Imgproc.matchTemplate(recorte, template, resultado, Imgproc.TM_CCOEFF_NORMED)
                      val mm = Core.minMaxLoc(resultado)
                      if (mm.maxVal < threshold) return null
                      val l = regiao.left + mm.maxLoc.x.toInt()
                      val t = regiao.top + mm.maxLoc.y.toInt()
                      return Rect(l, t, l + template.cols(), t + template.rows())
                  } finally {
                      resultado?.release()
                      recorte?.release()
                      bgr.release()
                      rgba.release()
                  }
              }

              fun regiaoBusca(w: Int, h: Int): Rect = Rect(
                  (w * Config.REGIAO_LEFT).toInt().coerceIn(0, w),
                  (h * Config.REGIAO_TOP).toInt().coerceIn(0, h),
                  (w * Config.REGIAO_RIGHT).toInt().coerceIn(0, w),
                  (h * Config.REGIAO_BOTTOM).toInt().coerceIn(0, h)
              )
          }
          ''',
          }
          for p, c in FILES.items():
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              with open(p, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(c)
          print('gerados:', len(FILES))
          PYEOF

