          "app/src/main/java/com/kai/rucoymacro/ModeFarm.kt": r'''// app/src/main/java/com/kai/rucoymacro/ModeFarm.kt
          package com.kai.rucoymacro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Rect
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.random.Random
          import kotlinx.coroutines.delay

          class ModeFarm(
              private val engine: MacroEngine,
              private val svc: MacroAccessibilityService,
              private val prefs: Prefs,
              private val appContext: Context
          ) {
              suspend fun ciclo(bmp: Bitmap): Boolean {
                  val regiao = Vision.regiaoBusca(bmp.width, bmp.height)
                  val thr = prefs.threshold.toDouble()

                  Vision.template(appContext, Config.ARQ_PLAYER, opcional = true)?.let { t ->
                      if (Vision.encontrar(bmp, t, thr, regiao) != null) {
                          delay(Random.nextLong(2000, 6001))
                          return false
                      }
                  }

                  val mob = Vision.template(appContext, Config.ARQ_MOB, opcional = false) ?: return false
                  val match = Vision.encontrar(bmp, mob, thr, regiao)
                  if (match == null) {
                      buscaAleatoria(bmp)
                      return false
                  }

                  Vision.template(appContext, Config.ARQ_EXHAUST, opcional = true)?.let { t ->
                      // Exausto só é procurado ao redor do match: evita falso positivo global.
                      val area = Rect(match)
                      area.inset(-t.cols(), -t.rows())
                      area.left = area.left.coerceAtLeast(regiao.left)
                      area.top = area.top.coerceAtLeast(regiao.top)
                      area.right = area.right.coerceAtMost(regiao.right)
                      area.bottom = area.bottom.coerceAtMost(regiao.bottom)
                      if (area.width() >= t.cols() && area.height() >= t.rows() &&
                          Vision.encontrar(bmp, t, thr, area) != null
                      ) {
                          buscaAleatoria(bmp)
                          return false
                      }
                  }

                  // O personagem fica no centro da tela; o match é o destino do deslocamento.
                  zigzag(bmp.width / 2f, bmp.height / 2f, match.centerX().toFloat(), match.centerY().toFloat(), bmp)
                  golpes()
                  return true
              }

              private suspend fun zigzag(x0: Float, y0: Float, x1: Float, y1: Float, bmp: Bitmap) {
                  val dx = (x1 - x0).toDouble()
                  val dy = (y1 - y0).toDouble()
                  val dist = hypot(dx, dy)
                  if (dist < 60.0) return
                  val ux = dx / dist
                  val uy = dy / dist
                  val px = -uy
                  val py = ux
                  val passos = ceil(dist / Config.PASSO_ZIGUEGUE_PX).toInt()
                  repeat(passos) {
                      var desvio = MacroEngine.gauss(0.0, Config.SIGMA_ZIGUEGUE_PX)
                      // Piso de 4 px no desvio perpendicular: nunca em linha reta.
                      if (abs(desvio) < 4.0) desvio = 4.0 * if (Random.nextBoolean()) 1.0 else -1.0
                      val sx = (x0 + ux * Config.PASSO_ZIGUEGUE_PX + px * desvio).toFloat()
                          .coerceIn(40f, bmp.width - 40f)
                      val sy = (y0 + uy * Config.PASSO_ZIGUEGUE_PX + py * desvio).toFloat()
                          .coerceIn(40f, bmp.height - 40f)
                      svc.swipeJitter(x0, y0, sx, sy, 260L)
                      engine.pausa(180.0, 0.3)
                  }
                  engine.pausa(250.0, 0.3)
              }

              private suspend fun golpes() {
                  val n = MacroEngine.gauss(Config.GOLPES_MEDIA, Config.GOLPES_SIGMA)
                      .roundToInt()
                      .coerceAtLeast(Config.GOLPES_MIN)
                  val dens = svc.resources.displayMetrics.density
                  val ax = prefs.ataqueXDp * dens
                  val ay = prefs.ataqueYDp * dens
                  repeat(n) {
                      svc.tapJitter(ax, ay)
                      engine.pausa(Config.PAUSA_GOLPE_MS, Config.PAUSA_GOLPE_SIGMA_REL)
                  }
              }

              private suspend fun buscaAleatoria(bmp: Bitmap) {
                  val ang = Random.nextDouble(0.0, 2.0 * PI)
                  val raio = Random.nextInt(Config.RAIO_BUSCA_MIN_PX, Config.RAIO_BUSCA_MAX_PX + 1)
                  val cx = bmp.width / 2f
                  val cy = bmp.height / 2f
                  // Margem de 40 px: evita as zonas de gesto de sistema nas bordas.
                  val fx = (cx + cos(ang) * raio).toFloat().coerceIn(40f, bmp.width - 40f)
                  val fy = (cy + sin(ang) * raio).toFloat().coerceIn(40f, bmp.height - 40f)
                  svc.swipeJitter(cx, cy, fx, fy, 320L)
                  engine.pausa(350.0, 0.3)
              }
          }
          ''',
          "app/src/main/java/com/kai/rucoymacro/ModeTrain.kt": r'''// app/src/main/java/com/kai/rucoymacro/ModeTrain.kt
          package com.kai.rucoymacro

          import android.os.SystemClock
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.random.Random

          class ModeTrain(
              private val engine: MacroEngine,
              private val svc: MacroAccessibilityService,
              private val prefs: Prefs
          ) {
              private var proximoMicro = SystemClock.elapsedRealtime() + janelaMicro()

              suspend fun ciclo(): Boolean {
                  val dens = svc.resources.displayMetrics.density
                  svc.tapJitter(prefs.trainXDp * dens, prefs.trainYDp * dens)
                  engine.pausa(Config.PAUSA_GOLPE_MS, Config.PAUSA_GOLPE_SIGMA_REL)
                  if (SystemClock.elapsedRealtime() >= proximoMicro) {
                      microSwipe()
                      proximoMicro = SystemClock.elapsedRealtime() + janelaMicro()
                  }
                  return false
              }

              private fun janelaMicro(): Long =
                  MacroEngine.gauss(Config.TRAIN_MICRO_MEDIA_MS, Config.TRAIN_MICRO_SIGMA_MS)
                      .toLong()
                      .coerceIn(Config.TRAIN_MICRO_MIN_MS.toLong(), Config.TRAIN_MICRO_MAX_MS.toLong())

              private suspend fun microSwipe() {
                  val dm = svc.resources.displayMetrics
                  val cx = dm.widthPixels / 2f
                  val cy = dm.heightPixels / 2f
                  val ang = Random.nextDouble(0.0, 2.0 * PI)
                  val len = Random.nextInt(Config.MICRO_SWIPE_MIN_PX, Config.MICRO_SWIPE_MAX_PX + 1)
                  val fx = (cx + cos(ang) * len).toFloat()
                  val fy = (cy + sin(ang) * len).toFloat()
                  svc.swipeJitter(cx, cy, fx, fy, 200L)
                  engine.pausa(120.0, 0.3)
                  svc.swipeJitter(fx, fy, cx, cy, 200L)
                  engine.pausa(150.0, 0.3)
              }
          }
          ''',
          "app/src/main/java/com/kai/rucoymacro/OverlayService.kt": r'''// app/src/main/java/com/kai/rucoymacro/OverlayService.kt
          package com.kai.rucoymacro

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.ContextThemeWrapper
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import com.kai.rucoymacro.databinding.OverlayLayoutBinding
          import java.util.Locale
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          class OverlayService : Service() {

              companion object {
                  @Volatile
                  var ativo = false
                      private set

                  private const val CANAL = "overlay"
                  private const val NOTIF_ID = 1
              }

              private lateinit var wm: WindowManager
              private lateinit var prefs: Prefs
              private lateinit var params: WindowManager.LayoutParams
              private var binding: OverlayLayoutBinding? = null
              private var engine: MacroEngine? = null
              private var statsJob: Job? = null
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  prefs = Prefs(this)
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  Vision.init()

                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CANAL, getString(R.string.notif_channel_name), NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val notif = NotificationCompat.Builder(this, CANAL)
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .setContentTitle(getString(R.string.notif_title))
                      .setContentText(getString(R.string.notif_text))
                      .setOngoing(true)
                      .setContentIntent(pi)
                      .build()
                  val tipo = if (Build.VERSION.SDK_INT >= 34) ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE else 0
                  ServiceCompat.startForeground(this, NOTIF_ID, notif, tipo)
                  ativo = true
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (binding == null) adicionarJanela()
                  return START_STICKY
              }

              private fun adicionarJanela() {
                  val inflater = LayoutInflater.from(ContextThemeWrapper(this, R.style.Theme_RucoyMacro))
                  val b = OverlayLayoutBinding.inflate(inflater)
                  binding = b

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = if (prefs.overlayX >= 0) prefs.overlayX else 12
                  // Canto inferior: fora da região de match (Config.REGIAO_BOTTOM = 0.72).
                  params.y = if (prefs.overlayY >= 0) prefs.overlayY
                  else (resources.displayMetrics.heightPixels * 0.80f).toInt()
                  wm.addView(b.root, params)

                  var downX = 0f
                  var downY = 0f
                  var origX = 0
                  var origY = 0
                  b.tvArrastar.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              origX = params.x
                              origY = params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = origX + (ev.rawX - downX).toInt()
                              params.y = origY + (ev.rawY - downY).toInt()
                              wm.updateViewLayout(b.root, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              prefs.overlayX = params.x
                              prefs.overlayY = params.y
                              true
                          }
                          else -> false
                      }
                  }

                  b.btnModo.text = prefs.modo
                  b.btnModo.setOnClickListener {
                      prefs.modo = if (prefs.modo == "FARM") "TRAIN" else "FARM"
                      b.btnModo.text = prefs.modo
                  }
                  b.btnMotor.setOnClickListener { alternarMotor() }
                  b.btnFechar.setOnClickListener { stopSelf() }
                  render(MacroEngine.Stats())
              }

              private fun alternarMotor() {
                  val e = engine
                  if (e != null && e.rodando) {
                      e.parar()
                      statsJob?.cancel()
                      binding?.btnMotor?.setText(R.string.overlay_iniciar)
                      render(e.stats.value)
                      return
                  }
                  val svc = MacroAccessibilityService.instance
                  if (svc == null || !svc.isReady) {
                      toast(getString(R.string.toast_ative_a11y))
                      return
                  }
                  if (!Vision.ok) {
                      toast(getString(R.string.toast_opencv_falhou))
                      return
                  }
                  engine?.dispose()
                  val novo = MacroEngine(svc, prefs, applicationContext)
                  engine = novo
                  novo.iniciar()
                  binding?.btnMotor?.setText(R.string.overlay_parar)
                  statsJob = scope.launch { novo.stats.collect { render(it) } }
              }

              private fun render(s: MacroEngine.Stats) {
                  binding?.tvPainelStatus?.text = getString(
                      R.string.fmt_painel_status, s.estado.name, s.ciclos, s.alvos, tempo(s.sessaoMs)
                  )
              }

              private fun tempo(ms: Long): String {
                  val t = ms / 1000
                  return String.format(Locale.getDefault(), "%02d:%02d:%02d", t / 3600, (t % 3600) / 60, t % 60)
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              override fun onDestroy() {
                  engine?.dispose()
                  statsJob?.cancel()
                  scope.cancel()
                  binding?.let { runCatching { wm.removeViewImmediate(it.root) } }
                  binding = null
                  ativo = false
                  super.onDestroy()
              }
          }
          ''',
          "app/src/main/java/com/kai/rucoymacro/Prefs.kt": r'''// app/src/main/java/com/kai/rucoymacro/Prefs.kt
          package com.kai.rucoymacro

          import android.content.Context

          class Prefs(context: Context) {
              private val sp = context.applicationContext.getSharedPreferences("rucoymacro", Context.MODE_PRIVATE)

              var modo: String
                  get() = sp.getString("modo", Config.MODO_INICIAL) ?: Config.MODO_INICIAL
