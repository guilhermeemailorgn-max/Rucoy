              var threshold: Float
                  get() = sp.getFloat("threshold", Config.THRESHOLD_PADRAO)
                  set(v) { sp.edit().putFloat("threshold", v.coerceIn(0.50f, 0.99f)).apply() }

              var ataqueXDp: Float
                  get() = sp.getFloat("ataque_x_dp", Config.ATAQUE_X_DP)
                  set(v) { sp.edit().putFloat("ataque_x_dp", v).apply() }

              var ataqueYDp: Float
                  get() = sp.getFloat("ataque_y_dp", Config.ATAQUE_Y_DP)
                  set(v) { sp.edit().putFloat("ataque_y_dp", v).apply() }

              var trainXDp: Float
                  get() = sp.getFloat("train_x_dp", Config.TRAIN_X_DP)
                  set(v) { sp.edit().putFloat("train_x_dp", v).apply() }

              var trainYDp: Float
                  get() = sp.getFloat("train_y_dp", Config.TRAIN_Y_DP)
                  set(v) { sp.edit().putFloat("train_y_dp", v).apply() }

              var overlayX: Int
                  get() = sp.getInt("overlay_x", -1)
                  set(v) { sp.edit().putInt("overlay_x", v).apply() }

              var overlayY: Int
                  get() = sp.getInt("overlay_y", -1)
                  set(v) { sp.edit().putInt("overlay_y", v).apply() }
          }
