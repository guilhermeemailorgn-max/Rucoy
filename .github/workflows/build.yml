# .github/workflows/build.yml
name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gerar projeto (build e manifest)
        run: |
          python3 - <<'PYEOF'
          import os
          FILES = {
          ".gitignore": r'''# .gitignore
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          captures/
          .externalNativeBuild/
          .cxx/
          *.jks
          ''',
          "app/build.gradle.kts": r'''// app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kai.rucoymacro"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.kai.rucoymacro"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  // Moto G47 é arm64: filtra ABIs e corta ~75% do peso do OpenCV no APK.
                  ndk { abiFilters += "arm64-v8a" }
              }

              buildFeatures { viewBinding = true }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
          }

          // PNG é binário e não cabe em entrega texto: placeholder gerado no build só se ausente; substitua por recorte real.
          val gerarTemplates by tasks.registering {
              val destino = layout.projectDirectory.dir("src/main/assets")
              outputs.dir(destino)
              doLast {
                  val arquivo = destino.file("mob.png").asFile
                  if (!arquivo.exists()) {
                      arquivo.parentFile.mkdirs()
                      val img = java.awt.image.BufferedImage(48, 48, java.awt.image.BufferedImage.TYPE_INT_RGB)
                      for (x in 0 until 48) for (y in 0 until 48) {
                          val cor = if ((x / 8 + y / 8) % 2 == 0) java.awt.Color(255, 0, 255) else java.awt.Color(0, 255, 255)
                          img.setRGB(x, y, cor.rgb)
                      }
                      javax.imageio.ImageIO.write(img, "png", arquivo)
                  }
              }
          }

          tasks.named("preBuild") { dependsOn(gerarTemplates) }

          dependencies {
              implementation("org.opencv:opencv:4.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          ''',
          "app/proguard-rules.pro": r'''# app/proguard-rules.pro
          -keep class org.opencv.** { *; }
          -dontwarn org.opencv.**
          -keep class com.kai.rucoymacro.MacroAccessibilityService { *; }
          -keep class com.kai.rucoymacro.OverlayService { *; }
          ''',
          "app/src/main/AndroidManifest.xml": r'''<!-- app/src/main/AndroidManifest.xml -->
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <!-- Leitura do template em /sdcard/RucoyMacro via caminho bruto (FUSE do MediaStore). -->
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.RucoyMacro">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="painel_flutuante_de_controle_de_automacao_local" />
                  </service>

                  <service
                      android:name=".MacroAccessibilityService"
                      android:exported="true"
                      android:label="@string/accessibility_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          ''',
          "build.gradle.kts": r'''// build.gradle.kts
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
          }
          ''',
          "gradle.properties": r'''# gradle.properties
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          ''',
          "gradle/wrapper/gradle-wrapper.properties": r'''# gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          ''',
          "settings.gradle.kts": r'''// settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RucoyMacro"
          include(":app")
          ''',
          }
          for p, c in FILES.items():
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              with open(p, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(c)
          print('gerados:', len(FILES))
          PYEOF

      - name: Gerar projeto (Kotlin)
        run: |
          python3 - <<'PYEOF'
          import os
          FILES = {
          "app/src/main/java/com/kai/rucoymacro/Config.kt": r'''// app/src/main/java/com/kai/rucoymacro/Config.kt
          package com.kai.rucoymacro

          object Config {
              const val PKG_ALVO = "com.gameresort.stupidmonsters"

              // Templates: /sdcard/RucoyMacro tem prioridade; assets é o fallback.
              const val DIR_TEMPLATES = "/sdcard/RucoyMacro"
              const val ARQ_MOB = "mob.png"
              const val ARQ_EXHAUST = "exhaust.png"
              const val ARQ_PLAYER = "player.png"

              const val THRESHOLD_PADRAO = 0.80f

              // Coordenadas em dp; convertidas para px em runtime com a densidade real.
              const val ATAQUE_X_DP = 330f
              const val ATAQUE_Y_DP = 610f
              const val POCAO_X_DP = 250f
              const val POCAO_Y_DP = 610f
              const val TRAIN_X_DP = 330f
              const val TRAIN_Y_DP = 610f

              const val SIGMA_TAP_PX = 3.0
              const val SIGMA_SWIPE_MS = 40.0
              const val SIGMA_ZIGUEGUE_PX = 14.0
              const val PASSO_ZIGUEGUE_PX = 140.0

              const val GOLPES_MEDIA = 3.0
              const val GOLPES_SIGMA = 1.0
              const val GOLPES_MIN = 2
              const val PAUSA_GOLPE_MS = 420.0
              const val PAUSA_GOLPE_SIGMA_REL = 0.25

              const val PAUSA_CICLO_MS = 600.0
              const val PAUSA_CICLO_SIGMA_REL = 0.30

              const val RAIO_BUSCA_MIN_PX = 200
              const val RAIO_BUSCA_MAX_PX = 400

              const val MICRO_SWIPE_MIN_PX = 30
              const val MICRO_SWIPE_MAX_PX = 80
              const val TRAIN_MICRO_MEDIA_MS = 65_000.0
              const val TRAIN_MICRO_SIGMA_MS = 12_500.0
              const val TRAIN_MICRO_MIN_MS = 40_000.0
              const val TRAIN_MICRO_MAX_MS = 90_000.0

              const val PAUSA_HUMANA_MEDIA_MS = 180_000.0
              const val PAUSA_HUMANA_SIGMA_REL = 0.35
              const val PAUSA_HUMANA_MIN_MS = 30_000.0
              const val PAUSA_HUMANA_DORME_MIN_MS = 10_000L
              const val PAUSA_HUMANA_DORME_MAX_MS = 40_000L

              const val MODO_INICIAL = "FARM"

              // Frações da tela: a busca de template ignora a faixa inferior, onde o overlay mora.
              const val REGIAO_LEFT = 0.0f
              const val REGIAO_TOP = 0.0f
              const val REGIAO_RIGHT = 1.0f
              const val REGIAO_BOTTOM = 0.72f
          }

          /*
           * NOTA DE COMPATIBILIDADE — Android 16 (API 36)
           *
           * 1) AccessibilityService.takeScreenshot (API 30+) é o caminho correto aqui.
           *    MediaProjection exigiria foregroundServiceType="mediaProjection" e
           *    consentimento por sessão via createScreenCaptureIntent — peso morto
           *    e desnecessário para automação 100% local.
           *
           * 2) Janelas TYPE_APPLICATION_OVERLAY não recebem os toques sintéticos do
           *    dispatchGesture destinados ao app abaixo delas (FLAG_NOT_FOCUSABLE
           *    repassa o que cai fora da janela). Ainda assim, o overlay deve ficar
           *    fora da região de match ou ser excluído da área de captura.
           *
           * 3) Android 14+: o foreground service specialUse que sustenta o overlay
           *    precisa ser iniciado com o app em foreground na primeira vez — por
           *    isso o botão de iniciar mora na MainActivity, não no boot receiver.
           *
           * 4) takeScreenshot retorna o display INTEIRO, incluindo o overlay. O painel
           *    nasce no canto inferior (y = 80% da altura) e a busca de template fica
           *    limitada ao Rect configurável REGIAO_* (72% superiores da tela).
           *
           * 5) APK sideloaded (artifact do GitHub Actions) em Android 13+: antes de
           *    ativar o serviço em Acessibilidade, habilite "Permitir configurações
           *    restritas" em Info do app > menu ⋮ (exigência do sistema para sideload).
           */
          ''',
          "app/src/main/java/com/kai/rucoymacro/MacroAccessibilityService.kt": r'''// app/src/main/java/com/kai/rucoymacro/MacroAccessibilityService.kt
          package com.kai.rucoymacro

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.os.Build
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.Executors
          import kotlin.coroutines.resume
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock

          class MacroAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: MacroAccessibilityService? = null
                      private set
              }

              private val gestureMutex = Mutex()
              // Conversão HardwareBuffer -> Bitmap fora da main thread.
              private val captureExecutor = Executors.newSingleThreadExecutor()

              @Volatile
              private var conectada = false

              val isReady: Boolean get() = conectada && Build.VERSION.SDK_INT >= 30

              override fun onServiceConnected() {
                  conectada = true
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) = Unit

              override fun onInterrupt() = Unit

              override fun onUnbind(intent: Intent?): Boolean {
                  conectada = false
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  conectada = false
                  instance = null
                  captureExecutor.shutdown()
                  super.onDestroy()
              }

              suspend fun captureBitmap(): Bitmap? {
                  if (Build.VERSION.SDK_INT < 30 || !conectada) return null
                  return suspendCancellableCoroutine { cont ->
                      takeScreenshot(Display.DEFAULT_DISPLAY, captureExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(screenshot: ScreenshotResult) {
                              val hw = Bitmap.wrapHardwareBuffer(screenshot.hardwareBuffer, screenshot.colorSpace)
                              val sw = hw?.copy(Bitmap.Config.ARGB_8888, false)
                              hw?.recycle()
                              screenshot.hardwareBuffer.close()
                              if (cont.isActive) cont.resume(sw) else sw?.recycle()
                          }

                          override fun onFailure(errorCode: Int) {
                              // Cobre ERROR_TAKE_SCREENSHOT_INTERVAL_TIME_SHORT (~1 captura/s); o motor re-tenta.
                              if (cont.isActive) cont.resume(null)
                          }
                      })
                  }
              }

              suspend fun tapJitter(x: Float, y: Float, sigmaPx: Double = Config.SIGMA_TAP_PX): Boolean {
                  val jx = (x + MacroEngine.gauss(0.0, sigmaPx)).toFloat()
                  val jy = (y + MacroEngine.gauss(0.0, sigmaPx)).toFloat()
                  val path = Path()
                  // Path de comprimento zero (só moveTo) é toque estacionário, conforme docs de StrokeDescription.
                  path.moveTo(jx, jy)
                  val gesto = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, 50L))
                      .build()
                  return executar(gesto)
              }

              suspend fun swipeJitter(
                  x1: Float,
                  y1: Float,
                  x2: Float,
                  y2: Float,
                  duracaoMs: Long,
                  sigmaMs: Double = Config.SIGMA_SWIPE_MS
              ): Boolean {
                  val dur = (duracaoMs + MacroEngine.gauss(0.0, sigmaMs)).toLong().coerceAtLeast(80L)
                  val path = Path()
                  path.moveTo(
                      (x1 + MacroEngine.gauss(0.0, Config.SIGMA_TAP_PX)).toFloat(),
                      (y1 + MacroEngine.gauss(0.0, Config.SIGMA_TAP_PX)).toFloat()
                  )
                  path.lineTo(
                      (x2 + MacroEngine.gauss(0.0, Config.SIGMA_TAP_PX)).toFloat(),
                      (y2 + MacroEngine.gauss(0.0, Config.SIGMA_TAP_PX)).toFloat()
                  )
                  val gesto = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, dur))
                      .build()
                  return executar(gesto)
              }

              // Fila serializada: o mutex + o callback onCompleted/onCancelled garantem um gesto por vez.
              private suspend fun executar(gesto: GestureDescription): Boolean = gestureMutex.withLock {
                  suspendCancellableCoroutine { cont ->
                      val aceito = dispatchGesture(gesto, object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(true)
                          }

                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(false)
                          }
                      }, null)
                      if (!aceito && cont.isActive) cont.resume(false)
                  }
              }
          }
          ''',
          "app/src/main/java/com/kai/rucoymacro/MacroEngine.kt": r'''// app/src/main/java/com/kai/rucoymacro/MacroEngine.kt
          package com.kai.rucoymacro

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.widget.Toast
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.ln
          import kotlin.math.sqrt
          import kotlin.random.Random
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.currentCoroutineContext
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch

          class MacroEngine(
              private val svc: MacroAccessibilityService,
              private val prefs: Prefs,
              private val appContext: Context
          ) {
              enum class Estado { IDLE, FARM, TRAIN }

              data class Stats(
                  val estado: Estado = Estado.IDLE,
                  val ciclos: Long = 0,
                  val alvos: Long = 0,
                  val sessaoMs: Long = 0
              )

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private var job: Job? = null
              private var ticker: Job? = null

              private val _stats = MutableStateFlow(Stats())
              val stats: StateFlow<Stats> = _stats.asStateFlow()

              val rodando: Boolean get() = job?.isActive == true

              private val mainHandler = Handler(Looper.getMainLooper())
              private var inicioSessao = 0L
              private var proximaPausaHumana = 0L
              private var ciclos = 0L
              private var alvos = 0L

              fun iniciar() {
                  if (rodando) return
                  ciclos = 0
                  alvos = 0
                  inicioSessao = SystemClock.elapsedRealtime()
                  proximaPausaHumana = inicioSessao + intervaloHumano()
                  _stats.value = Stats(estadoAtual(), 0, 0, 0)
                  job = scope.launch { loop() }
                  ticker = scope.launch {
                      while (isActive) {
                          _stats.update { it.copy(sessaoMs = SystemClock.elapsedRealtime() - inicioSessao) }
                          delay(1000)
                      }
                  }
              }

              fun parar() {
                  job?.cancel()
                  job = null
                  ticker?.cancel()
                  ticker = null
                  _stats.update { it.copy(estado = Estado.IDLE) }
              }

              fun dispose() {
                  parar()
                  scope.cancel()
              }

              private fun estadoAtual(): Estado {
                  val e = runCatching { Estado.valueOf(prefs.modo) }.getOrDefault(Estado.FARM)
                  return if (e == Estado.IDLE) Estado.FARM else e
              }

              private suspend fun loop() {
                  val farm = ModeFarm(this, svc, prefs, appContext)
                  val train = ModeTrain(this, svc, prefs)
                  while (currentCoroutineContext().isActive) {
                      if (!svc.isReady || !Vision.ok) {
                          delay(500)
                          continue
                      }
                      pausaHumanaSeDevido()
                      val modo = estadoAtual()
                      _stats.update { it.copy(estado = modo) }

                      var abateu = false
                      if (modo == Estado.TRAIN) {
                          // TRAIN não usa visão: evita o rate limit do takeScreenshot e captura à toa.
                          train.ciclo()
                      } else {
                          val bmp = svc.captureBitmap()
                          if (bmp == null) {
                              delay(500)
                              continue
                          }
                          abateu = try {
                              farm.ciclo(bmp)
                          } finally {
                              bmp.recycle()
                          }
                      }

                      ciclos++
                      if (abateu) alvos++
                      _stats.update {
                          it.copy(ciclos = ciclos, alvos = alvos, sessaoMs = SystemClock.elapsedRealtime() - inicioSessao)
                      }
                      pausa(Config.PAUSA_CICLO_MS, Config.PAUSA_CICLO_SIGMA_REL)
                  }
              }

              private fun intervaloHumano(): Long =
                  gauss(Config.PAUSA_HUMANA_MEDIA_MS, Config.PAUSA_HUMANA_MEDIA_MS * Config.PAUSA_HUMANA_SIGMA_REL)
                      .toLong()
                      .coerceAtLeast(Config.PAUSA_HUMANA_MIN_MS.toLong())

              private suspend fun pausaHumanaSeDevido() {
                  if (SystemClock.elapsedRealtime() < proximaPausaHumana) return
                  val msg = appContext.getString(R.string.fmt_pausa_humana, ciclos)
                  mainHandler.post { Toast.makeText(appContext, msg, Toast.LENGTH_LONG).show() }
                  delay(Random.nextLong(Config.PAUSA_HUMANA_DORME_MIN_MS, Config.PAUSA_HUMANA_DORME_MAX_MS + 1))
                  proximaPausaHumana = SystemClock.elapsedRealtime() + intervaloHumano()
              }

              suspend fun pausa(mediaMs: Double, sigmaRel: Double) {
                  delay(gauss(mediaMs, mediaMs * sigmaRel).toLong().coerceAtLeast(50L))
              }

              companion object {
                  // Box-Muller: u1 com piso evita ln(0).
                  fun gauss(media: Double, sigma: Double): Double {
                      val u1 = Random.nextDouble().coerceAtLeast(1e-12)
                      val u2 = Random.nextDouble()
                      return media + sigma * sqrt(-2.0 * ln(u1)) * cos(2.0 * PI * u2)
                  }
              }
          }
          ''',
          "app/src/main/java/com/kai/rucoymacro/MainActivity.kt": r'''// app/src/main/java/com/kai/rucoymacro/MainActivity.kt
          package com.kai.rucoymacro

          import android.Manifest
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.kai.rucoymacro.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var prefs: Prefs

              private val pedirNotificacao =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { iniciarOverlay() }

              private val pedirMidia =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  prefs = Prefs(this)

                  binding.etAtaqueX.setText(prefs.ataqueXDp.toString())
                  binding.etAtaqueY.setText(prefs.ataqueYDp.toString())
                  binding.etTrainX.setText(prefs.trainXDp.toString())
                  binding.etTrainY.setText(prefs.trainYDp.toString())
                  binding.etThreshold.setText(prefs.threshold.toString())
                  if (prefs.modo == "TRAIN") binding.rbTrain.isChecked = true else binding.rbFarm.isChecked = true

                  binding.btnAcessibilidade.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  binding.btnOverlayPerm.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }

                  binding.btnOverlayToggle.setOnClickListener {
                      if (OverlayService.ativo) {
                          stopService(Intent(this, OverlayService::class.java))
                      } else {
                          if (!Settings.canDrawOverlays(this)) {
                              toast(getString(R.string.toast_sem_overlay_perm))
                              return@setOnClickListener
                          }
                          if (Build.VERSION.SDK_INT >= 33 &&
                              ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                              PackageManager.PERMISSION_GRANTED
                          ) {
                              pedirNotificacao.launch(Manifest.permission.POST_NOTIFICATIONS)
                          } else {
                              iniciarOverlay()
                          }
                      }
                      binding.root.postDelayed({ atualizarStatus() }, 300)
                  }

                  binding.btnSalvar.setOnClickListener { salvar() }

                  // Template em /sdcard/RucoyMacro exige permissão de mídia (caminho bruto via FUSE).
                  val permissoesMidia = if (Build.VERSION.SDK_INT >= 33) {
                      arrayOf(Manifest.permission.READ_MEDIA_IMAGES)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  if (permissoesMidia.any {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                  ) {
                      pedirMidia.launch(permissoesMidia)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  atualizarStatus()
              }

              private fun iniciarOverlay() {
                  ContextCompat.startForegroundService(this, Intent(this, OverlayService::class.java))
                  binding.root.postDelayed({ atualizarStatus() }, 300)
              }

              private fun atualizarStatus() {
                  val a11y = acessibilidadeAtiva()
                  binding.tvStatusA11y.text = getString(
                      R.string.fmt_status_a11y,
                      getString(if (a11y) R.string.ligado else R.string.desligado)
                  )
                  binding.tvStatusOverlay.text = getString(
                      R.string.fmt_status_overlay,
                      getString(if (OverlayService.ativo) R.string.ligado else R.string.desligado)
                  )
                  binding.btnOverlayToggle.setText(
                      if (OverlayService.ativo) R.string.btn_parar_overlay else R.string.btn_iniciar_overlay
                  )
              }

              private fun acessibilidadeAtiva(): Boolean {
                  if (Settings.Secure.getInt(contentResolver, Settings.Secure.ACCESSIBILITY_ENABLED, 0) != 1) return false
                  val cn = ComponentName(this, MacroAccessibilityService::class.java)
                  val ativos = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?: return false
                  return ativos.split(':').any {
                      it.equals(cn.flattenToString(), ignoreCase = true) ||
                          it.equals(cn.flattenToShortString(), ignoreCase = true)
                  }
              }

              private fun salvar() {
                  prefs.ataqueXDp = binding.etAtaqueX.text.toString().toFloatOrNull() ?: prefs.ataqueXDp
                  prefs.ataqueYDp = binding.etAtaqueY.text.toString().toFloatOrNull() ?: prefs.ataqueYDp
                  prefs.trainXDp = binding.etTrainX.text.toString().toFloatOrNull() ?: prefs.trainXDp
                  prefs.trainYDp = binding.etTrainY.text.toString().toFloatOrNull() ?: prefs.trainYDp
                  prefs.threshold = binding.etThreshold.text.toString().toFloatOrNull() ?: prefs.threshold
                  prefs.modo = if (binding.rbTrain.isChecked) "TRAIN" else "FARM"
                  toast(getString(R.string.toast_salvo))
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
          }
